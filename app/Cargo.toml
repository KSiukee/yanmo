[package]
name = "yanmo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "研墨官方桌面壳（薄 UI，业务逻辑在 yanmo-core）"

[[bin]]
name = "yanmo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
yanmo-core.workspace = true
yanmo-proto.workspace = true

[dev-dependencies]
tempfile = "3"

# Windows API：盘符探测（卷序列号 / 卷标 / 可移动判定）+ 恢复时的"选一个库文件"对话框。
# **只在 Windows 上编**，其余平台不引入。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    # 选文件夹对话框（SHBrowseForFolderW + PIDL 释放）要用到 Shell 的 Common 子集
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
