[package]
name = "yanmo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "研墨官方桌面壳（薄 UI，业务逻辑在 yanmo-core）"

[[bin]]
name = "yanmo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
yanmo-core.workspace = true
yanmo-proto.workspace = true

[dev-dependencies]
tempfile = "3"

# 盘符探测（卷序列号 / 卷标 / 可移动判定）：**只在 Windows 上编**，其余平台不引入
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
