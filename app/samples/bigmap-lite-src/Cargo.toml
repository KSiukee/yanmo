[package]
name = "bigmap-lite-sample"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# 它不参与主仓的 workspace：示例模块单独编，跟核心的依赖图彻底分开。
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
