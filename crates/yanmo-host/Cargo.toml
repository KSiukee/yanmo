[package]
name = "yanmo-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "研墨模块沙箱宿主（独立进程，不链接核心）"

[dependencies]
serde.workspace = true
serde_json.workspace = true
yanmo-proto.workspace = true
yanmo-ipc = { path = "../yanmo-ipc" }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
url = "2"
wasmi = "0.40"

[dev-dependencies]
tempfile = "3"
wat = "1"

[lints.rust]
unsafe_code = "forbid"
