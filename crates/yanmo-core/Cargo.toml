[package]
name = "yanmo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "研墨核心引擎：数据权威 + 全部业务逻辑（零 UI 依赖）"

[features]
# ★ 测试专用：开启后允许替换时间源（Clock 注入）。
# 发布构建**绝不开**：发布二进制里不存在替换时间源的能力。
testing = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true

[dev-dependencies]
tempfile = "3"
# 只为**验收**服务：把编出来的 docx 当 ZIP 打开、逐件读回来看（发布产物不依赖任何打包库，
# ZIP 是核心自己写的——见 crates/yanmo-core/src/compile/zip.rs）
zip = { version = "4", default-features = false }

[lints.rust]
unsafe_code = "forbid"
