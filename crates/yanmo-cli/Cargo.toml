[package]
name = "yanmo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "研墨的命令行入口：不开窗也能读、写、导出与体检"

[[bin]]
name = "yanmo-cli"
path = "src/main.rs"

[dependencies]
yanmo-core.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# 只用来问一句「研墨是不是还开着这个数据目录」（命名互斥体），别的不碰。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[features]
# 与核心的测试特性同名同义：只影响本 crate 是否**存在**那几个调试参数，
# 发布构建里连解析分支都没有（见 `args.rs`）。
testing = ["yanmo-core/testing"]
