# 打 tag 就出包：测试不过就不出包；出了包就把产物、校验和、构建指纹挂到 Release 上。
#
# 为什么校验和必须在第一次分发之前就有：发给别人的是一个没有代码签名的可执行文件，
# 我们能给的最硬凭据就是「这个哈希 + 这份源码 + 这套工具链」。见 RELEASING.md。
#
# 权限说明：只申请 contents: write（建 Release 用），不碰其它任何东西。
name: release

on:
  push:
    tags: ["v*"]
  # 手动跑一遍：**默认只构建 + 上传产物**（本地出不了包时用得上）；
  # 填了 tag 就顺带把那一版的 Release 说明与资产刷成这次构建的——重发/补救用得上。
  # 为什么要有这个入口：tag 推送偶尔指望不上（比如刚删过又重推同名 tag、
  # 或者同一版要拿新提交重出一次包），而 Actions 页面上的「Run workflow」随时能点。
  workflow_dispatch:
    inputs:
      tag:
        description: "要（重新）写 Release 的 tag，例如 v0.49.0；留空 = 只构建不上 Release"
        required: false
        default: ""

permissions:
  contents: write

# 同一个 tag 只留一轮：把某一版重指到新提交（删 tag 再重推）时，上一轮**立刻取消**。
# 为什么必须钉死：不取消的话两轮会抢着写同一个 Release——晚结束的那一份用旧提交的
# 说明/产物把页面顶回去，看着像"改了没生效"（0.49.0 重指 tag 那次就是这样：
# 旧那轮在打包中途被删 tag 取消，日志里是一串 KeyboardInterrupt，容易误读成构建炸了）。
# 不同 tag 的 group 不同（group 里带 ref），所以发新版不会取消上一版的运行。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    # 卡死就明确失败，别无声烧额度（冷机器全量编译 + 打包，20 分钟上下是正常的）
    timeout-minutes: 60
    # 跑手的默认代码页是 cp1252（西文），Python 打印中文会 UnicodeEncodeError——
    # 真踩过：出包六步全绿，卡在下一步「生成发布说明」上，Release 一步都没走到。
    # 这两个环境变量让所有 Python 步骤一律走 UTF-8，不必依赖控制台代码页。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # 前端依赖的下载缓存（npm 的 cache 目录），省掉每次重下
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # ★ 出包慢的大头在这里：冷跑要**从零编译两遍依赖**（跑测试一遍 debug、打包一遍 release），
      #   而依赖树（tauri / wry / rusqlite 自带的 SQLite 源码）比我们自己的代码大得多。
      #   缓存 ~/.cargo 与 target/：命中后只重编我们改过的 crate，整条流水线从约 20 分钟
      #   降到个位数分钟。key 跟着 Cargo.lock 与 rustc 版本自动算（改依赖才失效）。
      - uses: Swatinem/rust-cache@v2
        with:
          # 失败也存：那次没过的运行里，依赖编译成果下次照样能省下来（省的是编译，不是跳过检查）
          cache-on-failure: true

      - name: 缓存前端 node_modules
        uses: actions/cache@v4
        with:
          path: app/frontend/node_modules
          # 跟着 package-lock 走；装完就不用再跑 npm install 了
          key: ${{ runner.os }}-node-modules-${{ hashFiles('app/frontend/package-lock.json') }}

      # tauri 打包第一个安装包时会去下 NSIS 工具链，缓存下来省一次网络往返
      - name: 缓存 tauri 打包工具（NSIS）
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('app/tauri.conf.json') }}
          restore-keys: ${{ runner.os }}-tauri-bundler-

      - name: 装 tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      # 和人一样跑同一条命令：工具链自检 → 版本一致 → 前端构建 → 跑测试（失败就不出包）
      # → 打包 → 归集产物 + SHA256 + 构建指纹
      # 出包前建议先在本地预演这两步：tools\rehearse-release.bat（它会把控制台代码页调成
      # 跑手那样的 1252，专门抓"本地绿、CI 红"的环境差异）
      - name: 一条命令构建
        run: tools\build-release.bat
        shell: cmd

      - name: 生成发布说明（CHANGELOG 最新一节 + 怎么核对）
        run: python tools/release_notes.py release-notes.md
        shell: cmd

      - name: 上传产物（手动跑时也能下载）
        uses: actions/upload-artifact@v4
        with:
          name: yanmo-installer
          if-no-files-found: error
          # 名字里带中文的文件用 ASCII 通配匹配（别在 CI 里赌非 ASCII 的 glob）
          path: |
            dist/*.exe
            dist/*.sha256
            dist/*.zip
            dist/*.txt

      - name: 建 Release
        # tag 推送照旧建；手动跑时**填了 tag 才建**（留空就只留 artifacts，不动页面）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # 手动跑时按输入的那个 tag 写；tag 推送时就是它自己
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/*.sha256
            dist/*.zip
            dist/*.txt
