# 仓库级 cargo 配置（对本目录下的所有 cargo 命令生效）。
#
# 为什么默认**关掉增量编译**：这个仓库的构建缓存膨胀得离谱——反复重编时（不同构建指纹下
# 各编一套：出包会往环境里塞自己的变量，加上频繁的测试与检查），被取代的那几套 cargo 不会
# 回收，实测攒到过 **148 GB**（其中 debug/incremental 一项 68 GB、31.6 万个碎文件）。
# 增量编译换来的是"改一点点重编很快"，代价是磁盘与几万个碎文件；这个仓库以整体重编为主，
# 那一头的收益不值这个价。
#
# 想临时要回增量（例如盯着一处慢慢调）：**环境变量比这里的配置优先**——
#
#     CARGO_INCREMENTAL=1 cargo check
#
# 为什么写在 `[build]` 而不是 `[env] CARGO_INCREMENTAL`：实测后者**对 cargo 自己的判断不生效**
# ——全量重编之后 debug/incremental 照样长回来（cargo 在应用 `[env]` 之前就读了自己的开关）。
# `[build] incremental` 才是它自己认的那个旋钮。
#
# 已经胖起来的缓存怎么清：`python3 tools/clean-cache.py`（它先报数，再按你说的删）。
[build]
incremental = false
